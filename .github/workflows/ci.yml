name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SGP4_PREFIX: ${{ github.workspace }}/sgp4-install
      SGP4_REPO_SHA: d176906dbfaf8361eee1f83bd1dc1bacc6582798  # pin dnwrnr/sgp4 (2025-11-03)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang \
            libncurses-dev libcurl4-openssl-dev pkg-config \
            python3-venv wget ca-certificates

      - name: Cache libsgp4 build
        id: cache-sgp4
        uses: actions/cache@v4
        with:
          path: ${{ env.SGP4_PREFIX }}
          key: sgp4-${{ runner.os }}-${{ env.SGP4_REPO_SHA }}-v1

      - name: Build & install libsgp4
        if: steps.cache-sgp4.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/dnwrnr/sgp4.git /tmp/sgp4
          cd /tmp/sgp4
          git checkout "$SGP4_REPO_SHA"
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX="$SGP4_PREFIX" -DCMAKE_BUILD_TYPE=Release ..
          make -j"$(nproc)"
          make install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('python_tracker/requirements.txt') }}

      - name: Create venv & install Python dependencies
        run: |
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r python_tracker/requirements.txt

      - name: Cache JPL DE421 ephemeris
        id: cache-de421
        uses: actions/cache@v4
        with:
          path: de421.bsp
          key: de421-jpl-v1

      - name: Download DE421 (if not cached)
        if: steps.cache-de421.outputs.cache-hit != 'true'
        run: |
          # Skyfield resolves 'de421.bsp' from the current working directory.
          # Fetch from NAIF (JPL); Skyfield's own default source is the same file.
          wget -q --tries=3 -O de421.bsp \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/a_old_versions/de421.bsp

      - name: Configure CMake
        run: |
          # sgp4 headers live under $SGP4_PREFIX/include/libsgp4 — CMakeLists.txt
          # already searches $HOME/sgp4/build/install, /usr/local, /usr, so add
          # $SGP4_PREFIX to the search chain via CMAKE_PREFIX_PATH + a symlink
          # into $HOME/sgp4/build/install (matches the existing search list).
          mkdir -p "$HOME/sgp4/build"
          ln -sfn "$SGP4_PREFIX" "$HOME/sgp4/build/install"

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_HAMLIB=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_PYTHON_BINDINGS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: ctest (hpop + earth_rotation + flare)
        working-directory: build
        run: ctest --output-on-failure

      - name: HPOP-vs-SGP4 24-hour ISS benchmark (compare_iss)
        run: build/compare_iss | tee compare_iss.log
      - name: Assert compare_iss finished
        run: |
          grep -q "Over 24 h" compare_iss.log

      - name: ve_hpop pybind sanity
        run: |
          ./venv/bin/python - <<'PY'
          import sys; sys.path.insert(0, 'build')
          import ve_hpop
          tle = ('ISS',
                 '1 25544U 98067A   25342.18171806  .00023618  00000+0  41560-3 0  9999',
                 '2 25544  51.6390 196.0228 0006517 314.6498 142.3419 15.50266153487131')
          p = ve_hpop.Propagator(*tle)
          r, v = p.propagate_jd(p.epoch_jd)
          rmag = sum(x*x for x in r) ** 0.5
          vmag = sum(x*x for x in v) ** 0.5
          print(f"ve_hpop OK: |r|={rmag:.3f} km, |v|={vmag:.3f} km/s")
          assert 6000 < rmag < 8000, f"|r| out of range: {rmag}"
          assert 7 < vmag < 9,       f"|v| out of range: {vmag}"
          PY

      - name: Python/C++ equivalence test
        run: ./venv/bin/python tests/test_equivalence.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            compare_iss.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # OD subsystem job: builds VisibleEphemeris with -DBUILD_OD=ON and runs the
  # 4 OD unit-test executables (10 assertions total) plus bench_synthetic.
  #
  # Requires the two sibling libraries at PINNED SHAs (Newton discipline: no
  # floating upstream dependencies). Both are public GitHub repos owned by
  # n4hy. If either sibling changes API, this job breaks and must be updated
  # deliberately.
  #
  # Uses GCC because NLF's Config file requires find_dependency(OpenMP), and
  # Ubuntu's default clang install lacks libomp headers. GCC 13 (ubuntu-latest)
  # ships libgomp built in.
  # --------------------------------------------------------------------------
  build-and-test-od:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SGP4_PREFIX: ${{ github.workspace }}/sgp4-install
      NLF_PREFIX: ${{ github.workspace }}/nlf-install
      SGP4_REPO_SHA: d176906dbfaf8361eee1f83bd1dc1bacc6582798
      OPTMATH_REPO_SHA: 817b643782e3bc721bf44f79de1cdf621a6620c2  # n4hy/OptimizedKernelsForRaspberryPi5_NvidiaCUDA (2026-08-02)
      NLF_REPO_SHA:     0a5edd19b9360ef3d30150fc57e1f930fd857e07  # n4hy/Modern-Computational-Nonlinear-Filtering    (2026-08-02)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ gcc \
            libncurses-dev libcurl4-openssl-dev pkg-config \
            libeigen3-dev libvulkan-dev \
            ca-certificates git

      - name: Cache libsgp4 build
        id: cache-sgp4
        uses: actions/cache@v4
        with:
          path: ${{ env.SGP4_PREFIX }}
          key: sgp4-${{ runner.os }}-${{ env.SGP4_REPO_SHA }}-v1

      - name: Build & install libsgp4
        if: steps.cache-sgp4.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/dnwrnr/sgp4.git /tmp/sgp4
          cd /tmp/sgp4
          git checkout "$SGP4_REPO_SHA"
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX="$SGP4_PREFIX" -DCMAKE_BUILD_TYPE=Release ..
          make -j"$(nproc)"
          make install

      - name: Cache NLF install (with vendored OptMath)
        id: cache-nlf
        uses: actions/cache@v4
        with:
          path: ${{ env.NLF_PREFIX }}
          # NLF vendors OptMathKernels via add_subdirectory, so the install
          # tree contains BOTH libraries. Cache key depends on BOTH SHAs;
          # a change in either invalidates the cache. Newton discipline:
          # pinned dependencies, deliberate updates.
          key: nlf-${{ runner.os }}-nlf-${{ env.NLF_REPO_SHA }}-optmath-${{ env.OPTMATH_REPO_SHA }}-v3

      - name: Clone + build + install NLF (vendors OptMath at pinned SHA)
        if: steps.cache-nlf.outputs.cache-hit != 'true'
        env:
          CC:  /usr/bin/gcc
          CXX: /usr/bin/g++
        run: |
          # NLF expects OptMathKernels as a SIBLING source directory (its
          # CMakeLists.txt does add_subdirectory(OPTMATH_DIR)). Clone both
          # at pinned SHAs; point NLF at our OptMath clone via OPTMATH_DIR
          # so it does NOT auto-fetch its own upstream copy at HEAD.
          git clone https://github.com/n4hy/OptimizedKernelsForRaspberryPi5_NvidiaCUDA.git /tmp/optmath
          ( cd /tmp/optmath && git checkout "$OPTMATH_REPO_SHA" )

          git clone https://github.com/n4hy/Modern-Computational-Nonlinear-Filtering.git /tmp/nlf
          ( cd /tmp/nlf && git checkout "$NLF_REPO_SHA" )

          # Configure NLF. Arch-specific SIMD backends (NEON/SVE2 in OptMath)
          # are auto-gated to ARM in OptMath's own CMakeLists (line 231 arch
          # check); on x86 they are silently no-op. Vulkan stays ON because
          # libvulkan-dev is installed. CUDA off (no GPU driver on the runner).
          cmake -B /tmp/nlf/build -S /tmp/nlf \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$NLF_PREFIX" \
            -DOPTMATH_DIR=/tmp/optmath \
            -DAUTO_CLONE_DEPS=OFF \
            -DNLF_BUILD_PYTHON_VENV=OFF
          cmake --build /tmp/nlf/build -j"$(nproc)"
          cmake --install /tmp/nlf/build

      - name: Configure VisibleEphemeris with BUILD_OD=ON
        env:
          CC:  /usr/bin/gcc
          CXX: /usr/bin/g++
        run: |
          # Mirror the existing job's libsgp4 symlink trick so our
          # CMakeLists.txt's built-in search list (~/sgp4/build/install)
          # finds the cached install.
          mkdir -p "$HOME/sgp4/build"
          ln -sfn "$SGP4_PREFIX" "$HOME/sgp4/build/install"

          # NLF's install tree contains BOTH nlfConfig.cmake and
          # OptMathKernelsConfig.cmake, so a single PREFIX suffices.
          cmake -S . -B build_od \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
            -DENABLE_HAMLIB=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_OD=ON \
            -DBUILD_OD_BENCHMARKS=ON \
            -Dnlf_DIR="$NLF_PREFIX/lib/cmake/nlf" \
            -DOptMathKernels_DIR="$NLF_PREFIX/lib/cmake/OptMathKernels"

      - name: Build ve_od + tests + benchmarks
        run: cmake --build build_od -j"$(nproc)"

      - name: ctest (OD unit-test suite)
        working-directory: build_od
        run: ctest --output-on-failure -R "^od_"

      - name: Run bench_synthetic (smoke test)
        working-directory: build_od
        run: |
          ./bench_synthetic | tee bench_synthetic.log
          # Assert the summary table produced 4 rows (b1_modeB, b1_modeD_iter,
          # b2_modeB, b2_modeD_iter). Fail loudly if the harness silently
          # produced fewer -- a Newton-discipline guardrail against a benchmark
          # that quietly skips cases.
          rows=$(grep -c '^b[12]_mode' bench_synthetic.log || true)
          if [ "$rows" -ne 4 ]; then
            echo "expected 4 bench_synthetic summary rows, got $rows"
            exit 1
          fi

      - name: bench_iss_pass harness (no data => clean exit)
        working-directory: build_od
        run: |
          # Newton discipline: this harness intentionally exits cleanly with
          # instructions when no VE_OD_ISS_DOPPLER env var is set. CI verifies
          # that path (that it does NOT fabricate a "real" result).
          ./bench_iss_pass

      - name: Upload OD logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-od-logs
          path: |
            build_od/bench_synthetic.log
            build_od/bench_synthetic_*.txt
            build_od/bench_synthetic_*.csv
            build_od/CMakeFiles/CMakeOutput.log
            build_od/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
